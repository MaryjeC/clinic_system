{% extends "_auth_base.html" %}
{% block title %}Log In{% endblock %}

{% block form %}
<h1 class="h3 fw-bold mb-1">Welcome back <span class="wave">👋</span></h1>
<p class="text-muted mb-4">Log in to open the clinic dashboard.</p>

<form method="post" novalidate>
  <div class="mb-3">
    <label class="form-label">Username</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-person"></i></span>
      <input type="text" name="username" class="form-control" value="{{ form.username or '' }}" autofocus required>
    </div>
  </div>
  <div class="mb-4">
    <label class="form-label">Password</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" name="password" id="password" class="form-control" required>
      <button type="button" class="input-group-text toggle-pw" data-target="password"><i class="bi bi-eye"></i></button>
    </div>
  </div>
  <button class="btn btn-clinic w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i> Log In</button>
</form>

<p class="text-center text-muted mt-4 mb-0">
  No account yet? <a href="{{ url_for('register') }}" class="link-clinic fw-semibold">Register here</a>
</p>
{% endblock %}

{% block scripts %}{% include "_toggle_pw.html" %}{% endblock %}
