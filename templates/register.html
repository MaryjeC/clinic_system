{% extends "_auth_base.html" %}
{% block title %}Register{% endblock %}

{% block form %}
<h1 class="h3 fw-bold mb-1">Create an account</h1>
<p class="text-muted mb-4">For clinic staff and nurses.</p>

<form method="post" novalidate>
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
      <input type="text" name="full_name" class="form-control" placeholder="e.g. Maria Santos"
             value="{{ form.full_name or '' }}" autofocus required>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Username</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-at"></i></span>
      <input type="text" name="username" class="form-control" placeholder="4-20 letters, numbers or _"
             value="{{ form.username or '' }}" required>
    </div>
  </div>
  <div class="row g-3 mb-4">
    <div class="col-sm-6">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" name="password" id="password" class="form-control" placeholder="At least 6 characters" required>
        <button type="button" class="input-group-text toggle-pw" data-target="password"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <div class="col-sm-6">
      <label class="form-label">Confirm password</label>
      <input type="password" name="confirm" class="form-control" required>
    </div>
  </div>
  <button class="btn btn-clinic w-100 py-2"><i class="bi bi-person-plus me-1"></i> Register</button>
</form>

<p class="text-center text-muted mt-4 mb-0">
  Already have an account? <a href="{{ url_for('login') }}" class="link-clinic fw-semibold">Log in</a>
</p>
{% endblock %}

{% block scripts %}{% include "_toggle_pw.html" %}{% endblock %}
